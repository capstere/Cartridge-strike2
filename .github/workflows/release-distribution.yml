name: Release distributions
on:
  pull_request:
    branches: [develop/cartridge-strike-3, main]
  push:
    branches: [main]
permissions:
  contents: read
  pages: read
jobs:
  verify-distributions:
    runs-on: ubuntu-latest
    outputs:
      publisher: ${{ steps.pages.outputs.publisher }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Identify the configured publishing source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source}' > "$RUNNER_TEMP/pages.json"
          cat "$RUNNER_TEMP/pages.json"
          jq -er 'select(.build_type=="workflow" or (.build_type=="legacy" and .source.branch=="main" and .source.path=="/")) | "publisher="+.build_type' "$RUNNER_TEMP/pages.json" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
      - run: node tools/pages-source.mjs
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Compare all published file names and bytes
        run: |
          npm ci --prefix server --ignore-scripts --no-audit
          node tools/runtime-distribution.mjs public "$RUNNER_TEMP/expected"
          python3 tools/verify-pages.py . _site
          if test ! -f deploy/online/pages-recovery.json; then
            diff --no-dereference -qr "$RUNNER_TEMP/expected" _site
          fi
      - name: Stage the exact private release and check its immutable retry
        run: |
          bash deploy/pilot/stage-release.sh --export-to "$RUNNER_TEMP/pilot"
          bash deploy/pilot/stage-release.sh --export-to "$RUNNER_TEMP/pilot"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify-distributions.outputs.publisher == 'workflow'
    needs: verify-distributions
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
  public-recovery:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Rehearse a clean CS2 Pages rollback in a separate checkout
        run: |
          previous=5364240599164c0aee278bb0ac2a35d662c3a818
          git fetch --no-tags --depth=1 origin "$previous"
          python3 deploy/online/pages-recovery.py "$previous" HEAD "$PWD/_cs2-recovery"
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_cs2-recovery
          destination: ./_restored-site
      - run: python3 tools/verify-pages.py _cs2-recovery _restored-site
      - name: Open the restored game under the actual Pages project path
        run: |
          npm ci --prefix frontline/source/tools/dev
          mkdir "$RUNNER_TEMP/pages-prefix"
          ln -s "$PWD/_restored-site" "$RUNNER_TEMP/pages-prefix/Cartridge-strike2"
          python3 -m http.server 8914 -b 127.0.0.1 -d "$RUNNER_TEMP/pages-prefix" > "$RUNNER_TEMP/recovery-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 8 --retry-connrefused --retry-delay 1 http://127.0.0.1:8914/Cartridge-strike2/ -o /dev/null
          CHROMIUM_PATH=$(command -v google-chrome) node tools/release-public-redirect.mjs
  pages-cache-upgrade:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
      - name: Visit CS2, update the site and deploy Scout with the same browser profile
        env:
          FPS_NETWORK_ANGLE: metal
        run: |
          previous=5364240599164c0aee278bb0ac2a35d662c3a818
          git fetch --no-tags --depth=1 origin "$previous"
          git worktree add --detach "$RUNNER_TEMP/cs2" "$previous"
          npm ci --prefix frontline/source/tools/dev
          node frontline/source/tools/dev/node_modules/playwright-core/cli.js install chromium
          node tools/release-visual-cache.mjs "$RUNNER_TEMP/cs2" "$PWD" test-results/cache-upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs2-pages-cache-upgrade
          path: test-results/cache-upgrade
          if-no-files-found: error
  english-release-journey:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
      - name: Visit fresh and returning English routes on the public release
        env:
          FPS_NETWORK_ANGLE: metal
          FPS_TEST_ORIGIN: http://127.0.0.1:8916/
          CS3_VISUAL_EVIDENCE: test-results/english-release
        run: |
          npm ci --prefix server --ignore-scripts
          npm ci --prefix frontline/source/tools/dev
          node frontline/source/tools/dev/node_modules/playwright-core/cli.js install chromium
          node tools/runtime-distribution.mjs public "$RUNNER_TEMP/game"
          python3 -m http.server 8916 -b 127.0.0.1 -d "$RUNNER_TEMP/game" > "$RUNNER_TEMP/english-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 8 --retry-connrefused --retry-delay 1 http://127.0.0.1:8916/ -o /dev/null
          node tools/release-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-and-returning-english-routes
          path: test-results/english-release
          if-no-files-found: error
