name: Release distributions
on:
  pull_request:
    branches: [develop/cartridge-strike-3, main]
  push:
    branches: [main]
permissions:
  contents: read
  pages: read
jobs:
  verify-distributions:
    runs-on: ubuntu-latest
    outputs:
      publisher: ${{ steps.pages.outputs.publisher }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Identify the configured publishing source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source}' > "$RUNNER_TEMP/pages.json"
          cat "$RUNNER_TEMP/pages.json"
          jq -er 'select(.build_type=="workflow" or (.build_type=="legacy" and .source.branch=="main" and .source.path=="/")) | "publisher="+.build_type' "$RUNNER_TEMP/pages.json" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
      - run: node tools/pages-source.mjs
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Compare all published file names and bytes
        run: |
          npm ci --prefix server --ignore-scripts --no-audit
          node tools/runtime-distribution.mjs public "$RUNNER_TEMP/expected"
          diff --no-dereference -qr "$RUNNER_TEMP/expected" _site
      - name: Stage the exact private release and check its immutable retry
        run: |
          bash deploy/pilot/stage-release.sh --export-to "$RUNNER_TEMP/pilot"
          bash deploy/pilot/stage-release.sh --export-to "$RUNNER_TEMP/pilot"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify-distributions.outputs.publisher == 'workflow'
    needs: verify-distributions
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
