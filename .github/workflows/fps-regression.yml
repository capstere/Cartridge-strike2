name: FPS regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded PR heads need no more runner time. Main checks are never cancelled.
concurrency:
  group: fps-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  multiplayer-foundation:
    # Full dependency/API verification belongs to PR/manual runs, not duplicate
    # post-merge browser/dependency jobs. The headless core tests also run below.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server --ignore-scripts
      - name: Verify the pinned Colyseus API against the shared headless engine
        run: |
          npm run build --prefix server -- --check
          npm test --prefix server
  node-tests:
    runs-on: ubuntu-latest
    # Preserve the existing offline/visual/mobile gates. Full two-scene gameplay
    # has its own GPU-backed job below; software-runner FPS is not a game gate.
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ github.event_name != 'push' && 'npm' || '' }}
          cache-dependency-path: frontline/source/tools/dev/package-lock.json
      - name: All FPS unit tests
        run: node --experimental-loader ./tools/vendor-three-test-loader.mjs --test src/fps/*.test.mjs tools/*.test.mjs
      - name: Validate isolated deployment operations
        run: python3 deploy/online/test_manage.py
      - name: Verify runtime file hashes
        run: node tools/verify-owner-runtime.mjs
      - name: Validate prepared Floor 5 door traversal
        run: node --experimental-loader ./tools/vendor-three-test-loader.mjs tools/owner-door-traversal.mjs --prepared
      - name: Install Chromium test browser
        if: github.event_name != 'push'
        run: |
          npm ci --prefix frontline/source/tools/dev
          node frontline/source/tools/dev/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Test live mobile, match flow and Floor 5 visibility
        if: github.event_name != 'push'
        timeout-minutes: 12
        run: |
          python3 -m http.server 8765 >/tmp/fps-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node tools/mobile-smoke.cjs
          node tools/match-flow-browser.mjs
          node tools/floor5-workstation-visibility.cjs
          node tools/actor-occlusion-browser.mjs
      - name: Verify shared character resources and exact animation poses
        if: github.event_name != 'push'
        timeout-minutes: 5
        run: |
          python3 -m http.server 8765 >/tmp/fps-sharing-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node tools/asset-sharing-browser.mjs
      - name: Verify simultaneous touch input and orientation lifecycle
        if: github.event_name != 'push'
        timeout-minutes: 6
        run: |
          python3 -m http.server 8765 >/tmp/fps-mobile-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node tools/mobile-reliability-browser.mjs

  multiplayer-gameplay:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontline/source/tools/dev/package-lock.json
      - run: npm ci --prefix server --ignore-scripts
      - run: npm ci --prefix frontline/source/tools/dev
      - run: node frontline/source/tools/dev/node_modules/playwright-core/cli.js install chromium
      - name: Invite login, room membership and gameplay through HTTPS and WSS
        timeout-minutes: 5
        env:
          FPS_NETWORK_ANGLE: metal
          FPS_NETWORK_DPR: '0.5'
        run: node tools/network-pilot-browser.mjs

      - name: Complete online lobby, combat, results and same-room rematch
        timeout-minutes: 5
        env:
          FPS_NETWORK_ANGLE: metal
        run: node tools/online-match-browser.mjs
      - name: Online equipment, destructible glass and two rendered players with eight bots
        timeout-minutes: 4
        env:
          FPS_NETWORK_ANGLE: metal
        run: node tools/online-equipment-browser.mjs
      - name: Classic desktop purchase and plant, touch purchase and defuse
        timeout-minutes: 5
        env:
          FPS_NETWORK_ANGLE: metal
        run: node tools/online-classic-browser.mjs
      - name: Keep compact online evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-match
          path: test-results/online/
          retention-days: 3

      - name: Full Floor 5 gameplay, jitter and 24 rendered lifecycle cycles
        timeout-minutes: 10
        env:
          FPS_NETWORK_LAN: '1'
          FPS_NETWORK_ANGLE: metal
          FPS_NETWORK_DPR: '1'
        run: npm run test:browser --prefix server

  lan-browsers:
    if: github.event_name != 'push'
    name: lan-${{ matrix.os }}-${{ matrix.mobile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mobile: chromium
          - os: windows-latest
            mobile: chromium
          - os: macos-15
            mobile: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Keep committed bytes for compatibility hashes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontline/source/tools/dev/package-lock.json
      - run: npm ci --prefix server --ignore-scripts
      - run: npm ci --prefix frontline/source/tools/dev
      - run: node frontline/source/tools/dev/node_modules/playwright-core/cli.js install --with-deps chromium ${{ matrix.mobile }}
      - name: Verify matching build on this operating system
        run: npm run build --prefix server -- --check
      - name: Private-IP HTTP, mobile input, interruption and cleanup
        timeout-minutes: 7
        env:
          FPS_LAN_MOBILE_BROWSER: ${{ matrix.mobile }}
          FPS_NETWORK_ANGLE: ${{ runner.os == 'macOS' && 'metal' || 'swiftshader' }}
          FPS_NETWORK_DPR: ${{ runner.os == 'Windows' && '0.25' || '0.5' }}
          FPS_LAN_PROTOCOL_PEER: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: npm run test:lan --prefix server
      - name: Normal desktop launch with real keys and pointer lock
        timeout-minutes: 3
        env:
          FPS_NETWORK_LAN: '1'
          FPS_NETWORK_ANGLE: ${{ runner.os == 'macOS' && 'metal' || 'swiftshader' }}
          # Keep two rendered Linux scenes; compatibility is not an FPS test.
          # Full-map two-browser GPU gameplay above remains at DPR 1.
          FPS_NETWORK_DPR: ${{ runner.os == 'macOS' && '0.5' || '0.25' }}
          FPS_LAN_PROTOCOL_PEER: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: node --import ./server/register-shared.mjs tools/network-launch-browser.mjs
      - name: Keep compact LAN browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lan-${{ matrix.os }}-${{ matrix.mobile }}
          path: |
            test-results/lan/
            test-results/network/normal-launch*.json
          if-no-files-found: ignore
          retention-days: 7

  multiplayer-pass3b:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontline/source/tools/dev/package-lock.json
      - run: npm ci --prefix server --ignore-scripts
      - run: npm ci --prefix frontline/source/tools/dev
      - run: node frontline/source/tools/dev/node_modules/playwright-core/cli.js install chromium
      - name: Two rendered clients at 2/4/10 humans and 0/50/100/150/250 ms RTT
        timeout-minutes: 9
        env:
          FPS_NETWORK_ANGLE: metal
          FPS_NETWORK_DPR: '1'
        run: node --import ./server/register-shared.mjs tools/network-5v5-browser.mjs
      - name: Separate-process authority measurements at 2/4/10 clients
        timeout-minutes: 3
        run: node --import ./server/register-shared.mjs tools/network-load.mjs
      - name: Keep PASS 3B measurements and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-pass3b
          path: test-results/pass3b/
          if-no-files-found: ignore
          retention-days: 3
