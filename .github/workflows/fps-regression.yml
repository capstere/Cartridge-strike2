name: FPS regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded PR heads need no more runner time. Main checks are never cancelled.
concurrency:
  group: fps-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  multiplayer-foundation:
    # Full dependency/API verification belongs to PR/manual runs, not duplicate
    # post-merge browser/dependency jobs. The headless core tests also run below.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server --ignore-scripts
      - name: Verify the pinned Colyseus API against the shared headless engine
        run: |
          npm run build --prefix server -- --check
          npm test --prefix server
  node-tests:
    runs-on: ubuntu-latest
    # Measured offline/browser setup takes ~12m30s on software runners; leave
    # the full bounded 8-minute network step and final cleanup time available.
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ github.event_name != 'push' && 'npm' || '' }}
          cache-dependency-path: frontline/source/tools/dev/package-lock.json
      - name: All FPS unit tests
        run: node --experimental-loader ./tools/vendor-three-test-loader.mjs --test src/fps/*.test.mjs tools/*.test.mjs
      - name: Verify runtime file hashes
        run: node tools/verify-owner-runtime.mjs
      - name: Validate prepared Floor 5 door traversal
        run: node --experimental-loader ./tools/vendor-three-test-loader.mjs tools/owner-door-traversal.mjs --prepared
      - name: Install Chromium test browser
        if: github.event_name != 'push'
        run: |
          npm ci --prefix frontline/source/tools/dev
          node frontline/source/tools/dev/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Test live mobile, match flow and Floor 5 visibility
        if: github.event_name != 'push'
        timeout-minutes: 12
        run: |
          python3 -m http.server 8765 >/tmp/fps-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node tools/mobile-smoke.cjs
          node tools/match-flow-browser.mjs
          node tools/floor5-workstation-visibility.cjs
          node tools/actor-occlusion-browser.mjs
      - name: Verify shared character resources and exact animation poses
        if: github.event_name != 'push'
        timeout-minutes: 5
        run: |
          python3 -m http.server 8765 >/tmp/fps-sharing-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node tools/asset-sharing-browser.mjs
      - name: Verify simultaneous touch input and orientation lifecycle
        if: github.event_name != 'push'
        timeout-minutes: 6
        run: |
          python3 -m http.server 8765 >/tmp/fps-mobile-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node tools/mobile-reliability-browser.mjs
      # Reuse this job's Chromium install. Main keeps the existing fast checks;
      # full network gameplay runs once per PR/manual run on the pinned server LTS.
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version-file: server/.node-version
      - name: Two-browser authoritative gameplay with latency and cleanup
        if: github.event_name != 'push'
        # Both complete software-rendered scenarios need shader startup time.
        timeout-minutes: 8
        run: |
          npm ci --prefix server --ignore-scripts
          npm run test:browser --prefix server
